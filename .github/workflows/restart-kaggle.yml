name: restart-kaggle
on:
  schedule:
    - cron: "23 */11 * * *"
  workflow_dispatch: {}

jobs:
  push-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kaggle
      - name: Write kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_JSON_B64 }}" | base64 -d > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      - name: Push cindy-hands kernel
        working-directory: cindy-brain/hands
        run: kaggle kernels push -p .
